<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Darija Translator</title><link rel="stylesheet" href="sidepanel.css"></head><body>
<header><h1>Darija Translator</h1><p>Translate selected text into Moroccan Arabic</p></header>
<label for="source">Text to translate</label><textarea id="source" placeholder="Select text on a webpage, right-click, then choose Translate selection to Darija..."></textarea>
<div class="actions"><button id="translate">Translate</button><button id="paste">Paste clipboard</button></div>
<section><div class="result-head"><h2>Darija</h2><div><button id="copy" class="secondary">Copy</button><button id="speak" class="secondary">Read aloud</button></div></div><div id="result" aria-live="polite">Your translation will appear here.</div></section>
<p id="status" role="status"></p>
<details><summary>Connection & sign-in</summary><label>API base URL<input id="baseUrl" value="http://localhost:8080/darija-translator/api"></label><label>Username<input id="username" value="translator" autocomplete="username"></label><label>Password<input id="password" type="password" value="ChangeMe123!" autocomplete="current-password"></label><button id="save" class="secondary">Save settings</button></details>
<script src="sidepanel.js"></script></body></html>
